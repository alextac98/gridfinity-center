# Local end-to-end stack for testing the Next.js app image. Not a production
# deployment.
#
#   docker compose up --build
#   open http://localhost:3000
#
# Set WEB_PORT to publish the app on a different host port.
#
# Optional: export R2_* variables to exercise the slicer handoff.

services:
  web:
    build:
      context: .
      args:
        GRIDFINITY_COMMIT_SHA: "${GRIDFINITY_COMMIT_SHA:-}"
        NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
    environment:
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

